<svg width="1600" height="360" viewBox="0 0 1600 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1330"/>
      <stop offset="45%" stop-color="#141E46"/>
      <stop offset="100%" stop-color="#0A2A43"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B2FF7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00E0C6" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FD1FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4FD1FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="1600" height="360" fill="url(#bg)"/>

  <!-- flowing background waves -->
  <path d="M0,260 C260,180 480,320 760,240 C1040,160 1280,300 1600,220 L1600,360 L0,360 Z" fill="url(#wave1)"/>
  <path d="M0,300 C300,240 560,340 860,270 C1140,205 1360,320 1600,270 L1600,360 L0,360 Z" fill="url(#wave2)"/>

  <!-- circuit / network nodes -->
  <g stroke="#5FE1E8" stroke-width="1.4" stroke-opacity="0.55" fill="none" filter="url(#soft)">
    <path d="M120,90 L260,140 L400,80 L560,150 L740,70"/>
    <path d="M260,140 L260,230"/>
    <path d="M560,150 L560,60"/>
    <path d="M900,120 L1060,170 L1230,90 L1400,160 L1520,100"/>
    <path d="M1060,170 L1060,260"/>
    <path d="M1230,90 L1230,190"/>
  </g>

  <g fill="#8FF0FF">
    <circle cx="120" cy="90" r="5"/>
    <circle cx="260" cy="140" r="6"/>
    <circle cx="400" cy="80" r="4.5"/>
    <circle cx="560" cy="150" r="6"/>
    <circle cx="740" cy="70" r="5"/>
    <circle cx="260" cy="230" r="4"/>
    <circle cx="560" cy="60" r="4"/>
    <circle cx="900" cy="120" r="5"/>
    <circle cx="1060" cy="170" r="6"/>
    <circle cx="1230" cy="90" r="4.5"/>
    <circle cx="1400" cy="160" r="6"/>
    <circle cx="1520" cy="100" r="5"/>
    <circle cx="1060" cy="260" r="4"/>
    <circle cx="1230" cy="190" r="4"/>
  </g>

  <!-- soft glow accents -->
  <circle cx="260" cy="140" r="70" fill="url(#glow)" opacity="0.5"/>
  <circle cx="1060" cy="170" r="90" fill="url(#glow)" opacity="0.4"/>
  <circle cx="740" cy="260" r="60" fill="url(#glow)" opacity="0.3"/>

  <!-- fine dotted texture -->
  <g fill="#ffffff" opacity="0.12">
    <circle cx="80" cy="300" r="2"/>
    <circle cx="180" cy="330" r="2"/>
    <circle cx="340" cy="310" r="2"/>
    <circle cx="620" cy="320" r="2"/>
    <circle cx="980" cy="300" r="2"/>
    <circle cx="1150" cy="330" r="2"/>
    <circle cx="1340" cy="310" r="2"/>
    <circle cx="1500" cy="320" r="2"/>
  </g>
</svg>
